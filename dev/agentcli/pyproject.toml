[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-cli"
version = "1.30.6"
description = "Anvil CLI (Typer)"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "httpx>=0.27"]

[project.scripts]
anvil = "anvil_cli.main:app"

[tool.setuptools.packages.find]
include = ["anvil_cli*"]
